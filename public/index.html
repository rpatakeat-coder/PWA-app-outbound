<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      viewport-fit=cover: sem isso o react-native-safe-area-context nao enxerga
      as env(safe-area-inset-*) e o app fica com a barra de status do iPhone
      cobrindo o header quando instalado na tela inicial.

      user-scalable=no: impede o zoom de pinça DA PAGINA. O mapa continua com
      pinça propria (a Google trata o gesto internamente); sem isso os dois
      competiriam e a pinça sobre o mapa zoaria o layout inteiro.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>Takeat RPA</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Gestao de rota, leads e visitas do time de campo da Takeat." />

    <!-- iOS nao le o manifest pra tudo: precisa destas tags pra abrir em tela
         cheia (sem barra do Safari) quando adicionado a tela de inicio. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      `default`, e NAO `black-translucent`.

      Com `black-translucent` o iOS DIMENSIONA a web view como se a barra de
      status fosse opaca (844 - 47 = 797 num iPhone 13) mas POSICIONA como se
      fosse translucida, em y=0. Ela termina em 797 numa tela de 844, e sobram
      47 pontos no rodape que nao pertencem a web view — a barra de abas
      flutuava acima do fim da tela e aparecia uma faixa embaixo dela.

      Medido no aparelho, PWA instalado (iPhone 13):
        env(safe-area-inset-top) 47 · innerHeight 797 · screen.height 844
      e um elemento em `bottom: -47px` NAO renderiza — a superficie termina em
      797 mesmo. Nenhum CSS alcanca aquela faixa; por isso o
      `position: fixed; inset: 0` do #root, que esta' correto, nao resolvia.

      Com `default` o iOS dimensiona e posiciona de forma coerente: a web view
      vai de 47 ate' 844, `env(safe-area-inset-top)` passa a 0 e
      `env(safe-area-inset-bottom)` continua 34 pro indicador de home. O app
      nao precisa de ajuste: ele ja' le os insets — o `paddingTop: insets.top`
      do container zera sozinho e o `paddingBottom` da barra segue valendo.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Takeat RPA" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />

    <!--
      Marca o <html> quando o app roda instalado (fora do navegador).

      O `@media (display-mode: standalone)` sozinho nao serve no iOS: no web
      app adicionado a' tela de inicio ele e' historicamente inconstante, e
      quem responde por la' e' o `navigator.standalone` — proprietario da
      Apple, e o unico sinal confiavel nesse ambiente. Le os dois e marca o
      atributo antes do primeiro paint, pra a regra do #root (mais abaixo) nao
      depender de um so'.
    -->
    <script>
      (function () {
        try {
          var casa = function (q) {
            return window.matchMedia ? window.matchMedia(q).matches : false;
          };
          if (
            window.navigator.standalone === true ||
            casa('(display-mode: standalone)') ||
            casa('(display-mode: fullscreen)')
          ) {
            document.documentElement.setAttribute('data-standalone', '');
          }
        } catch (e) {
          /* Sem sinal, fica o comportamento de navegador — que ja' funciona. */
        }
      })();
    </script>

    <!--
      Paleta em variáveis CSS.

      Isto existe porque o app roda em react-native-web: os estilos viram
      classes CSS, e `backgroundColor: 'var(--surface)'` chega intacto ao
      navegador. Assim o modo escuro é uma troca de atributo no <html> — sem
      contexto de tema no React, sem re-render de árvore, sem refatorar os
      StyleSheet pra função de tema.

      SÓ o "cromo" (fundo, texto, borda) é tokenizado. Cores de significado —
      temperatura do funil, status, vermelho da marca — permanecem literais:
      se elas invertessem, o mapa perderia a leitura.
    -->
    <!--
      Poppins — typography.fontFamily.sans do design system oficial da Takeat.
      Só os pesos usados (400/500/600/800). `display=swap` mostra o texto na
      fonte do sistema enquanto a Poppins carrega: num app de rua, com 3G ruim,
      é a diferença entre ler agora e esperar o download.
      Se ela nunca chegar, o fallback abaixo mantém tudo legível.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style id="takeat-theme">
      /*
        Paleta da Takeat em variáveis CSS.

        Funciona porque o app roda em react-native-web: os estilos viram
        classes CSS e `backgroundColor: 'var(--surface)'` chega intacto ao
        navegador. Trocar de tema é mudar um atributo no <html> — sem contexto
        de tema no React e sem StyleSheet virar função.

        Os valores vem do DESIGN SYSTEM OFICIAL da Takeat:
        https://raw.githubusercontent.com/takeat-design/UIKIT/main/design-system.json
        ("Official Dashboard Design System" 1.0.1) — os mesmos tokens que o
        cockpit de gestao usa, pra os dois produtos pararem de divergir.

        A paleta creme anterior (#FFFEF2 / #F0E6CC) saiu: ela nao existe no
        design system, cuja escala neutra e' cinza (neutral.50 -> .500).

        Tres degraus do design system NAO passam no AA e por isso nao aparecem
        como cor de texto: neutral.300 (4.29), green.500 (2.07, e' teal de
        preenchimento) e yellow.500 (1.79). O verde de status vem do
        tertiary.green2 e o amarelo legivel e' so' o yellow.700.

        --text-subtle usa #6B6B6B, que NAO esta no design system: entre o
        neutral.300 e o .400 falta um degrau, e o 300 reprova. Vale levar pro
        time de design.

        O modo escuro usa os TOKENS SEMANTICOS OFICIAIS de foundations.md §1
        (surface/*, text/*, stroke/*). No escuro o texto e o traco sao BRANCO
        COM OPACIDADE, e nao hex chapado — e' o que cria a hierarquia sobre
        qualquer superficie escura e o que faz o mesmo token funcionar sobre
        card e sobre fundo.

        Correcao: uma versao anterior deste arquivo dizia que o design system
        so' publicava a escala clara, e derivava valores proprios. Estava
        errado — a escala escura existe e e' esta.

        O tema escuro é derivado dela — preto QUENTE, não cinza-azulado, para
        combinar com o creme e o vermelho — e o creme da marca vira a cor do
        texto.

        Cores com SIGNIFICADO (temperatura do funil, status) seguem literais
        no código: se invertessem, o mapa perderia a leitura.

        Os valores escuros são declarados UMA vez (--d-*); os dois seletores
        (preferência do aparelho e escolha manual) apenas apontam pra eles.
      */
      :root {
        --d-bg: #121212;
        --d-surface: #1E1E1E;
        --d-surface-2: #262626;
        --d-surface-3: #2A2A2A;
        --d-text: rgba(255, 255, 255, 0.92);
        --d-text-muted: rgba(255, 255, 255, 0.64);
        --d-text-subtle: rgba(255, 255, 255, 0.38);
        --d-text-faint: rgba(255, 255, 255, 0.30);
        --d-border: rgba(255, 255, 255, 0.12);
        --d-border-soft: rgba(255, 255, 255, 0.08);
        --d-surface-overlay: rgba(18, 18, 18, 0.93);
        --d-surface-warn: #33280F;
        --d-tint-red: #3A1416;
        --d-tint-red-border: #7A2E32;
        --d-tint-red-text: #E5A1A4;
        --d-tint-green: #14301D;
        --d-tint-green-border: #2E5C3C;
        --d-tint-green-text: #77BD8B;
        --d-tint-amber: #33280F;
        --d-tint-amber-border: #6E5520;
        --d-tint-amber-text: #FFD894;
        --d-tint-blue: #0A2836;
        --d-tint-blue-border: #1E5A78;
        --d-brand-text: #E5A1A4;
        --d-info-text: #66CFFF;
        --d-violet-text: #C4B5FD;
        --d-tint-blue-text: #99DFFF;
        --d-stroke-default: rgba(255, 255, 255, 0.14);
        --d-stroke-strong: rgba(255, 255, 255, 0.24);
        --d-text-disabled: rgba(255, 255, 255, 0.28);
        --d-teal-text: #5FD3C6;

        --bg: #F6F6F6;
        --surface: #FFFFFF;
        --surface-2: #F6F6F6;
        --surface-3: #EDEDED;
        --text: #222222;
        --text-muted: #545454;
        --text-subtle: #6B6B6B;
        --text-faint: #7A7A7A;
        --border: #EDEDED;
        --border-soft: #F6F6F6;
        --surface-overlay: rgba(255, 255, 255, 0.94);
        --surface-warn: #FFF8EB;
        --tint-red: #FAE8E9;
        --tint-red-border: #E5A1A4;
        --tint-red-text: #94090F;
        --tint-green: #EAF7EE;
        --tint-green-border: #A5C7AF;
        --tint-green-text: #167532;
        --tint-amber: #FFF8EB;
        --tint-amber-border: #FFD894;
        --tint-amber-text: #99670F;
        --tint-blue: #E6F7FF;
        --tint-blue-border: #99DFFF;
        --brand-text: #C8131B;
        --info-text: #016999;
        --violet-text: #8B5CF6;
        --tint-blue-text: #016999;
        --stroke-default: #C6C6C6;
        --stroke-strong: #7A7A7A;
        --text-disabled: #C6C6C6;
        --teal-text: #1D9688;
        color-scheme: light;
      }

      /* Padrão do aparelho, quando o vendedor não escolheu nada. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: var(--d-bg);
          --surface: var(--d-surface);
          --surface-2: var(--d-surface-2);
          --surface-3: var(--d-surface-3);
          --text: var(--d-text);
          --text-muted: var(--d-text-muted);
          --text-subtle: var(--d-text-subtle);
          --text-faint: var(--d-text-faint);
          --border: var(--d-border);
          --border-soft: var(--d-border-soft);
          --surface-overlay: var(--d-surface-overlay);
          --surface-warn: var(--d-surface-warn);
          --tint-red: var(--d-tint-red);
          --tint-red-border: var(--d-tint-red-border);
          --tint-red-text: var(--d-tint-red-text);
          --tint-green: var(--d-tint-green);
          --tint-green-border: var(--d-tint-green-border);
          --tint-green-text: var(--d-tint-green-text);
          --tint-amber: var(--d-tint-amber);
          --tint-amber-border: var(--d-tint-amber-border);
          --tint-amber-text: var(--d-tint-amber-text);
          --tint-blue: var(--d-tint-blue);
          --tint-blue-border: var(--d-tint-blue-border);
        --brand-text: var(--d-brand-text);
        --info-text: var(--d-info-text);
        --violet-text: var(--d-violet-text);
        --tint-blue-text: var(--d-tint-blue-text);
        --stroke-default: var(--d-stroke-default);
        --stroke-strong: var(--d-stroke-strong);
        --text-disabled: var(--d-text-disabled);
        --teal-text: var(--d-teal-text);
          color-scheme: dark;
        }
      }

      /* Escolha explícita nas configurações vence o padrão do aparelho. */
      :root[data-theme='dark'] {
          --bg: var(--d-bg);
          --surface: var(--d-surface);
          --surface-2: var(--d-surface-2);
          --surface-3: var(--d-surface-3);
          --text: var(--d-text);
          --text-muted: var(--d-text-muted);
          --text-subtle: var(--d-text-subtle);
          --text-faint: var(--d-text-faint);
          --border: var(--d-border);
          --border-soft: var(--d-border-soft);
          --surface-overlay: var(--d-surface-overlay);
          --surface-warn: var(--d-surface-warn);
          --tint-red: var(--d-tint-red);
          --tint-red-border: var(--d-tint-red-border);
          --tint-red-text: var(--d-tint-red-text);
          --tint-green: var(--d-tint-green);
          --tint-green-border: var(--d-tint-green-border);
          --tint-green-text: var(--d-tint-green-text);
          --tint-amber: var(--d-tint-amber);
          --tint-amber-border: var(--d-tint-amber-border);
          --tint-amber-text: var(--d-tint-amber-text);
          --tint-blue: var(--d-tint-blue);
          --tint-blue-border: var(--d-tint-blue-border);
        --tint-blue-text: var(--d-tint-blue-text);
          --brand-text: var(--d-brand-text);
          --info-text: var(--d-info-text);
          --violet-text: var(--d-violet-text);
        --stroke-default: var(--d-stroke-default);
        --stroke-strong: var(--d-stroke-strong);
        --text-disabled: var(--d-text-disabled);
        --teal-text: var(--d-teal-text);
          color-scheme: dark;
      }

      /*
        A FONTE OFICIAL NUNCA RENDERIZAVA. O react-native-web escreve a pilha
        do SISTEMA como classe em cada <Text>, entao o Poppins declarado no
        body era sobrescrito em todo texto do app. O seletor com #root tem
        especificidade 1-0-1 e vence as classes 0-1-0 do RNW sem !important —
        e sem quebrar estilos inline (o mapa define os proprios rotulos).
      */
      #root div, #root span, #root p, #root a, #root input, #root textarea, #root button {
        font-family: Poppins, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      body {
        background-color: var(--bg);
      }

      /*
        Interacao do shell desktop (handoff design_handoff_desktop_web).
        O react-native-web nao expressa :hover/:focus-visible/transition nos
        StyleSheets; os componentes marcam o DOM com dataSet (vira data-*) e
        o comportamento vive aqui. Tudo condicionado a hover real + largura
        >= 768 pra nao vazar pro touch/mobile.
      */
      #root :focus-visible {
        outline: 2px solid #016999; /* azul de foco de components.md */
        outline-offset: 2px;
      }
      [tabindex='-1']:focus {
        outline: none; /* foco programatico de titulo ao trocar de aba */
      }
      /*
        Campo COMPOSTO (borda no wrapper, <input> dentro): o anel de foco
        global caia no input interno, desalinhado da caixa — o "quadrado
        azul" do login. O anel passa pro wrapper via :focus-within e o input
        interno fica sem outline. So' em tela larga: no celular o campo volta
        ao visual de sempre (sem anel de toque).
      */
      [data-campo] input:focus,
      [data-campo] input:focus-visible {
        outline: none;
      }
      @media (min-width: 768px) {
        [data-campo]:focus-within {
          outline: 2px solid #016999;
          outline-offset: 2px;
        }
      }
      [data-sidebar] {
        width: 72px;
        transition: width 0.16s cubic-bezier(0.2, 0.7, 0.3, 1);
        overflow: hidden;
      }
      [data-sidebar] [data-rotulo] {
        opacity: 0;
        transition: opacity 0.16s;
      }
      [data-badge-nav] {
        left: 34px;
        transition: left 0.16s;
      }
      /* Hover expande so no desktop (>=1024): no tablet a sidebar e' fixa em 72. */
      @media (hover: hover) and (min-width: 1024px) {
        [data-sidebar]:hover {
          width: 240px;
          box-shadow: 4px 0 16px rgba(0, 0, 0, 0.14);
        }
        [data-sidebar]:hover [data-rotulo] {
          opacity: 1;
        }
        [data-sidebar]:hover [data-badge-nav] {
          left: 176px;
        }
      }
      @media (hover: hover) and (min-width: 768px) {
        [data-hover='surface2']:hover {
          background-color: var(--surface-2) !important;
        }
        [data-hover='tintred']:hover {
          background-color: var(--tint-red) !important;
        }
        [data-hover='darkred']:hover {
          background-color: #94090f !important;
        }
        [data-hover='borda']:hover {
          border-color: var(--stroke-strong) !important;
        }
      }
      /* Pin do mapa: 36px no celular, 40px no web (alvo de clique melhor). */
      @media (min-width: 768px) {
        [data-pin] {
          width: 40px !important;
          height: 40px !important;
          border-radius: 20px !important;
          border-width: 2.5px !important;
        }
      }
      /* Modal de etapa no desktop: campos obrigatorios em duas colunas
         (Ag. Pagamento tem 13 campos — uma coluna virava rolagem infinita). */
      @media (min-width: 1024px) {
        [data-campos] {
          display: grid !important;
          grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
          gap: 4px 16px;
        }
      }
      [data-trans] {
        transition: background-color 0.15s ease, border-color 0.15s ease,
          color 0.15s ease, box-shadow 0.15s ease;
      }
    </style>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /*
          No PWA instalado do iOS, `height: 100%` resolve pra altura que o
          Safari reportou no carregamento — que NAO inclui a faixa da barra de
          gestos. O app terminava acima dela e sobrava uma faixa branca do
          fundo do body embaixo da barra de abas.

          `100dvh` (dynamic viewport height) mede a viewport de verdade, ja'
          contando a area segura. `-webkit-fill-available` fica antes como
          reserva pra iOS < 15.4, que ignora dvh; quem entende as duas usa a
          ultima declarada.
        */
        height: -webkit-fill-available;
        height: 100dvh;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /*
        O `100dvh` acima nao fechou o caso no PWA INSTALADO do iOS: ele ainda
        reporta a altura de antes da faixa da barra de gestos, o app termina
        acima dela e sobra o fundo do body (--bg, cinza) embaixo das abas — a
        barra inteira parece empurrada pra cima. E' o mesmo sintoma do
        8512fc5, com um vao menor.

        `position: fixed; inset: 0` nao depende de unidade de viewport
        nenhuma: ancora o app nas quatro bordas da janela. So' no modo
        instalado, porque no Safari com a barra flutuante a viewport de
        layout inclui a area da barra — la' o `100dvh` e' que esta' certo, e
        fixar tudo poria as abas embaixo do toolbar.

        O gatilho e' o `data-standalone` que o script do <head> marca, e nao
        um `@media (display-mode: standalone)` puro: no iPhone essa media
        query nao e' confiavel no app da tela de inicio, e e' a explicacao de
        a primeira tentativa nao ter mudado nada na tela.

        A reserva da area segura continua onde estava (o `paddingBottom:
        insets.bottom` da barra): o que muda e' so' onde o app termina.
      */
      html[data-standalone] #root {
        position: fixed;
        inset: 0;
      }

      /* Segura o "puxa pra atualizar" do Chrome Android: num app de mapa o
         gesto de arrastar pra baixo e' pan, nao refresh. */
      body {
        overscroll-behavior-y: contain;
        -webkit-tap-highlight-color: transparent;
      }

      /* Pino/controles da Google herdariam a fonte do host; fixa a fonte de
         sistema pra bater com o resto do app. */
      body {
        font-family: Poppins, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>

  <body>
    <noscript>
      Você precisa habilitar o JavaScript para usar este app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
