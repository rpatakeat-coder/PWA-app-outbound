<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      viewport-fit=cover: sem isso o react-native-safe-area-context nao enxerga
      as env(safe-area-inset-*) e o app fica com a barra de status do iPhone
      cobrindo o header quando instalado na tela inicial.

      user-scalable=no: impede o zoom de pinça DA PAGINA. O mapa continua com
      pinça propria (a Google trata o gesto internamente); sem isso os dois
      competiriam e a pinça sobre o mapa zoaria o layout inteiro.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>Takeat RPA</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Gestao de rota, leads e visitas do time de campo da Takeat." />

    <!-- iOS nao le o manifest pra tudo: precisa destas tags pra abrir em tela
         cheia (sem barra do Safari) quando adicionado a tela de inicio. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Takeat RPA" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />

    <!--
      Paleta em variáveis CSS.

      Isto existe porque o app roda em react-native-web: os estilos viram
      classes CSS, e `backgroundColor: 'var(--surface)'` chega intacto ao
      navegador. Assim o modo escuro é uma troca de atributo no <html> — sem
      contexto de tema no React, sem re-render de árvore, sem refatorar os
      StyleSheet pra função de tema.

      SÓ o "cromo" (fundo, texto, borda) é tokenizado. Cores de significado —
      temperatura do funil, status, vermelho da marca — permanecem literais:
      se elas invertessem, o mapa perderia a leitura.
    -->
    <style id="takeat-theme">
      /*
        Paleta da Takeat em variáveis CSS.

        Funciona porque o app roda em react-native-web: os estilos viram
        classes CSS e `backgroundColor: 'var(--surface)'` chega intacto ao
        navegador. Trocar de tema é mudar um atributo no <html> — sem contexto
        de tema no React e sem StyleSheet virar função.

        Base da marca: vermelho #C8131B, creme #FFFEF2, preto #222222,
        amarelo #FFD966 / #FFB32F, acento #A50F16.

        O tema escuro é derivado dela — preto QUENTE, não cinza-azulado, para
        combinar com o creme e o vermelho — e o creme da marca vira a cor do
        texto.

        Cores com SIGNIFICADO (temperatura do funil, status) seguem literais
        no código: se invertessem, o mapa perderia a leitura.

        Os valores escuros são declarados UMA vez (--d-*); os dois seletores
        (preferência do aparelho e escolha manual) apenas apontam pra eles.
      */
      :root {
        --d-bg: #17150F;
        --d-surface: #211E17;
        --d-surface-2: #2B2720;
        --d-surface-3: #3A352B;
        --d-text: #FFFEF2;
        --d-text-muted: #BDB6A4;
        --d-text-subtle: #8F887A;
        --d-text-faint: #635D52;
        --d-border: #3A352B;
        --d-border-soft: #2A261F;
        --d-surface-overlay: rgba(28, 25, 18, 0.93);
        --d-surface-warn: #2E2515;
        --d-tint-red: #2E1214;
        --d-tint-red-border: #632024;
        --d-tint-red-text: #F2A3A7;
        --d-tint-green: #122A18;
        --d-tint-green-border: #265C33;
        --d-tint-green-text: #8FE0A2;
        --d-tint-amber: #302512;
        --d-tint-amber-border: #6E5520;
        --d-tint-amber-text: #FFD966;
        --d-tint-blue: #101E33;
        --d-tint-blue-border: #2C4970;
        --d-brand-text: #F2727A;
        --d-info-text: #8AB4F8;
        --d-violet-text: #C4B5FD;
        --d-tint-blue-text: #BBD6F5;

        --bg: #FFFEF2;
        --surface: #FFFFFF;
        --surface-2: #F9F4E4;
        --surface-3: #F0E6CC;
        --text: #222222;
        --text-muted: #6B6B6B;
        --text-subtle: #8A8A8A;
        --text-faint: #B5B5B5;
        --border: #F0E6CC;
        --border-soft: #F7F1E1;
        --surface-overlay: rgba(255, 254, 242, 0.94);
        --surface-warn: #FFF6E0;
        --tint-red: #FDEDEE;
        --tint-red-border: #F5C9CC;
        --tint-red-text: #A50F16;
        --tint-green: #EFF8F0;
        --tint-green-border: #C3E6C9;
        --tint-green-text: #1B6B32;
        --tint-amber: #FFF6E0;
        --tint-amber-border: #FFD966;
        --tint-amber-text: #8A5A00;
        --tint-blue: #EEF4FB;
        --tint-blue-border: #C6DBF2;
        --brand-text: #C8131B;
        --info-text: #2563EB;
        --violet-text: #8B5CF6;
        --tint-blue-text: #1B4A85;
        color-scheme: light;
      }

      /* Padrão do aparelho, quando o vendedor não escolheu nada. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: var(--d-bg);
          --surface: var(--d-surface);
          --surface-2: var(--d-surface-2);
          --surface-3: var(--d-surface-3);
          --text: var(--d-text);
          --text-muted: var(--d-text-muted);
          --text-subtle: var(--d-text-subtle);
          --text-faint: var(--d-text-faint);
          --border: var(--d-border);
          --border-soft: var(--d-border-soft);
          --surface-overlay: var(--d-surface-overlay);
          --surface-warn: var(--d-surface-warn);
          --tint-red: var(--d-tint-red);
          --tint-red-border: var(--d-tint-red-border);
          --tint-red-text: var(--d-tint-red-text);
          --tint-green: var(--d-tint-green);
          --tint-green-border: var(--d-tint-green-border);
          --tint-green-text: var(--d-tint-green-text);
          --tint-amber: var(--d-tint-amber);
          --tint-amber-border: var(--d-tint-amber-border);
          --tint-amber-text: var(--d-tint-amber-text);
          --tint-blue: var(--d-tint-blue);
          --tint-blue-border: var(--d-tint-blue-border);
          --brand-text: #C8131B;
        --info-text: #2563EB;
        --violet-text: #8B5CF6;
        --brand-text: var(--d-brand-text);
        --info-text: var(--d-info-text);
        --violet-text: var(--d-violet-text);
        --tint-blue-text: var(--d-tint-blue-text);
          color-scheme: dark;
        }
      }

      /* Escolha explícita nas configurações vence o padrão do aparelho. */
      :root[data-theme='dark'] {
          --bg: var(--d-bg);
          --surface: var(--d-surface);
          --surface-2: var(--d-surface-2);
          --surface-3: var(--d-surface-3);
          --text: var(--d-text);
          --text-muted: var(--d-text-muted);
          --text-subtle: var(--d-text-subtle);
          --text-faint: var(--d-text-faint);
          --border: var(--d-border);
          --border-soft: var(--d-border-soft);
          --surface-overlay: var(--d-surface-overlay);
          --surface-warn: var(--d-surface-warn);
          --tint-red: var(--d-tint-red);
          --tint-red-border: var(--d-tint-red-border);
          --tint-red-text: var(--d-tint-red-text);
          --tint-green: var(--d-tint-green);
          --tint-green-border: var(--d-tint-green-border);
          --tint-green-text: var(--d-tint-green-text);
          --tint-amber: var(--d-tint-amber);
          --tint-amber-border: var(--d-tint-amber-border);
          --tint-amber-text: var(--d-tint-amber-text);
          --tint-blue: var(--d-tint-blue);
          --tint-blue-border: var(--d-tint-blue-border);
          --brand-text: #C8131B;
        --info-text: #2563EB;
        --violet-text: #8B5CF6;
        --tint-blue-text: var(--d-tint-blue-text);
        color-scheme: dark;
      }

      body {
        background-color: var(--bg);
      }
    </style>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /*
          No PWA instalado do iOS, `height: 100%` resolve pra altura que o
          Safari reportou no carregamento — que NAO inclui a faixa da barra de
          gestos. O app terminava acima dela e sobrava uma faixa branca do
          fundo do body embaixo da barra de abas.

          `100dvh` (dynamic viewport height) mede a viewport de verdade, ja'
          contando a area segura. `-webkit-fill-available` fica antes como
          reserva pra iOS < 15.4, que ignora dvh; quem entende as duas usa a
          ultima declarada.
        */
        height: -webkit-fill-available;
        height: 100dvh;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* Segura o "puxa pra atualizar" do Chrome Android: num app de mapa o
         gesto de arrastar pra baixo e' pan, nao refresh. */
      body {
        overscroll-behavior-y: contain;
        -webkit-tap-highlight-color: transparent;
      }

      /* Pino/controles da Google herdariam a fonte do host; fixa a fonte de
         sistema pra bater com o resto do app. */
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>

  <body>
    <noscript>
      Você precisa habilitar o JavaScript para usar este app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
