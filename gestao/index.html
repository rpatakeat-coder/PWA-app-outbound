<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      Os MESMOS icones da pagina principal. O cockpit e' servido em /gestao do
      mesmo dominio do app de campo, entao o caminho absoluto resolve nos
      arquivos que o `expo export` gera na raiz — sem duplicar asset e sem
      risco de as duas marcas divergirem.

      O que estava aqui era o `favicon.svg` padrao do Vite: um raio roxo
      (#863bff) que nao tem nada a ver com a Takeat. Ficava parecendo que a
      aba estava sem icone.

      POR QUE O CAMINHO SOBREVIVE AO `base: '/gestao/'`: o Vite so' reescreve
      href absoluto pra ${base} quando consegue RESOLVER o arquivo no projeto.
      Estes tres nao existem em gestao/public/, entao ele os deixa como estao —
      que e' o que queremos, porque eles moram na raiz do dominio. Era esse o
      mecanismo que quebrava o /favicon.svg: aquele existia aqui, virava
      /gestao/favicon.svg, e servia o raio roxo.

      Efeito colateral aceito: no servidor de dev isolado do cockpit
      (`npm run dev` dentro de gestao/) a aba fica sem icone, porque a raiz ali
      nao tem os arquivos do app. Em producao, e no `npm run build` + `serve`,
      os dois produtos dividem o dominio e o icone aparece.
    -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Takeat · Gestão</title>

    <!--
      Poppins — typography.fontFamily.sans do design system oficial.
      Só os pesos que o cockpit usa (400/500/600/800): puxar a família inteira
      seriam ~10 arquivos pra nada. `display=swap` mostra o texto na fonte de
      sistema enquanto a Poppins carrega, em vez de deixar a tela em branco.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap"
      rel="stylesheet"
    />

    <script>
      // Tema ANTES do primeiro paint.
      //
      // O cockpit e o app de campo vivem no mesmo domínio, então dividem o
      // localStorage: a chave 'takeat.theme' é a mesma que src/theme.ts grava
      // quando o vendedor escolhe claro/escuro lá. Sem isto, quem está no
      // escuro abriria /gestao numa tela branca.
      //
      // Inline e antes do bundle de propósito — se ficasse pra depois do React
      // montar, a tela abriria clara e piscaria pra escura.
      try {
        var pref = localStorage.getItem('takeat.theme');
        if (pref === 'dark' || pref === 'light') {
          document.documentElement.setAttribute('data-theme', pref);
        }
        // Sem preferência salva: nada a fazer — o @media prefers-color-scheme
        // do tokens.css já resolve pelo padrão do aparelho.
      } catch (e) {
        // localStorage bloqueado (aba anônima com cookies restritos): segue no
        // padrão do aparelho em vez de quebrar a página.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
